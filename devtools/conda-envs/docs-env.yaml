name: readthedocs-environment
channels:
  - openeye
  - conda-forge

dependencies:
  - python ==3.12.13
  - pip
  # https://github.com/leeping/forcebalance/issues/307
  - setuptools=81.0.0

    ### Core dependencies.

  - numpy ==1.26.4
  - pydantic =1
  - pyyaml
  - tqdm
  - rich
  - click
  - click-option-group
  - rdkit =2024.03.5
  - openff-utilities
  - openff-toolkit ==0.16.5
  - openff-interchange ==0.3.29
  - openff-forcefields ==2026.01.0
  - openff-qcsubmit ==0.50.3
  - openmm ==8.5.2

    # Optional
  - forcebalance
  - openff-fragmenter-base
  - openeye-toolkits

    ### Bespoke dependencies

  - qcportal ==0.53
  - qcelemental <0.50
  - qcengine <0.50
  - chemper
  - geometric <1
  - torsiondrive
  - pymbar

    # Executor
  - uvicorn
  - fastapi
  - celery
  - httpx
  - redis-server
  - redis-py =7.1.1

    ### Documentation dependencies

  - sphinx =4.5.0
  - sphinx-notfound-page
  - sphinx-click
  - myst-parser
  - autodoc-pydantic
  - sphinxcontrib-bibtex

  # Dependencies not available on Conda Forge
  - pip:
    # Documentation theme
    - git+https://github.com/openforcefield/openff-sphinx-theme.git@main
